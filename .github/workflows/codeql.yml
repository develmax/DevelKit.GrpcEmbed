name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended
      - name: Restore
        run: dotnet restore GrpcEmbed.sln
      - name: Build for analysis
        run: dotnet build GrpcEmbed.sln --configuration Release --no-restore --no-incremental -m:1 /nodeReuse:false -p:UseSharedCompilation=false
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
