name: Feature request
description: Suggest an improvement to GrpcEmbed.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the problem and who would benefit.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API or configuration you would like and any compatibility or security implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and additional context
